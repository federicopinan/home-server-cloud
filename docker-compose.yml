services:
  decloud:
    build: .
    # Keep the container private to the host; put a TLS tunnel/reverse proxy in front.
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      # Mount your actual directories here
      - ./data/books:/data/books
      - ./data/files:/data/files
      - ./data/music:/data/music
      - decloud-cache:/data/cache
    environment:
      - DECLOUD_PORT=8899
      - DECLOUD_HOST=127.0.0.1
      - DECLOUD_PIN=${DECLOUD_PIN:?DECLOUD_PIN must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DECLOUD_BOOKS_DIR=/data/books
      - DECLOUD_FILES_DIR=/data/files
      - DECLOUD_MUSIC_DIR=/data/music
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: unless-stopped

volumes:
  decloud-cache:
